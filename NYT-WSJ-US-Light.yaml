# ==============================================================================
# 规则名称: 纽约时报、华尔街日报与美国轻量金融/敏感服务合并规则集
# 英文标识: NYT-WSJ-US-Light
# 更新时间: 2026-09-25
# 规则说明: 整合 NYT-WSJ 与 US-Strict-DataUsage-Light 全量规则，涵盖纽约时报、华尔街日报、
#           道琼斯集团、PayPal、Venmo、Braintree、Xoom 等美国原生高防风控敏感资产
# 适用平台: Stash / Clash rule-providers (behavior: domain)
# 推荐策略: 🇺🇸 US Light Data Usage Select (优质美国原生/静态纯净节点)
# ==============================================================================
payload:
  # ============================================================================
  # 【第一部分：The New York Times (NYT / 纽约时报) 官方生态】
  # ============================================================================
  # 1. 核心主站、国际站与移动端统一 API
  - '+.nytimes.com'                             # 纽约时报核心主站、国际版、中文网与 Samizdat GraphQL API
  - '+.nyt.com'                                 # 纽约时报核心短域、移动端通用接口与多媒体服务
  - '+.newyorktimes.com'                        # 纽约时报官方品牌保护与跳转域名

  # 2. 图像多媒体、视频点播与官方发布
  - '+.nytimg.com'                              # 纽约时报官方高清图床与多媒体 CDN
  - '+.nytco.com'                               # 纽约时报集团公司 (The New York Times Company) 企业官网与官方发布
  - '+.nytstyle.com'                            # 纽约时报时尚生活版 (T Magazine) 官方资源
  - '+.nytdiff.com'                             # 纽约时报文章实时版本对比追踪服务

  # ============================================================================
  # 【第二部分：The Wall Street Journal (WSJ / 华尔街日报) 官方生态】
  # ============================================================================
  # 1. 核心主站、数字报刊与移动端 API
  - '+.wsj.com'                                 # 华尔街日报主站、移动端 API、报刊数字版 (pbc/pblog) 与图表
  - '+.wsjplus.com'                             # WSJ+ 华尔街日报订阅读者专属会员权益平台

  # 2. 流媒体切片、音视频分发与图床 CDN
  - '+.wsj.net'                                 # 华尔街日报核心音视频流媒体 (wsjstream)、高清图床与静态组件

  # ============================================================================
  # 【第三部分：Dow Jones (道琼斯集团与 News Corp 商业财经矩阵)】
  # ============================================================================
  # 1. 道琼斯统一云基础设施、API 网关与单点登录 (SSO)
  - '+.dowjones.com'                            # 道琼斯公司官网、统一单点登录认证 (sso.accounts) 与官方图库
  - '+.dowjones.io'                             # 道琼斯云原生微服务网关、公共共享数据 (shared-data) 与视频调度
  - '+.dowjoneson.com'                          # 道琼斯在线订单履约与读者订阅服务系统 (oms)

  # 2. 华尔街日报姊妹投资刊物与专业金融快讯旗舰
  - '+.barrons.com'                             # Barron's (巴伦周刊 - 华尔街日报姊妹刊，百年权威专业投资旗舰)
  - '+.marketwatch.com'                         # MarketWatch (道琼斯旗下全球金融行情、快讯与实时美股大盘)
  - '+.mansionglobal.com'                       # Mansion Global (道琼斯旗下环球高端不动产与豪宅投资平台)
  - '+.factiva.com'                             # Factiva (道琼斯全球商业情报、公司研报与新闻数据库)
  - '+.newscgp.com'                             # News Corp Global Platform (新闻集团统一服务与标签管理)

  # ============================================================================
  # 【第四部分：抓包精准捕获之定制分析、云存储与读者鉴权通道】
  # ============================================================================
  # 1. Adobe 为道琼斯深度定制的专用数据上报接口
  - 'dowjones.hb-api.omtrdc.net'                # Adobe Omniture 专为道琼斯定制的实时行为分析节点
  - 'dowjones.sc.omtrdc.net'                    # Adobe SiteCatalyst 专为道琼斯定制的读者访问统计节点

  # 2. 道琼斯专用 AWS 资产存储桶 (图片与多区域客户服务资产)
  - 'djcm-pnp.s3.amazonaws.com'                 # 道琼斯内容管理系统 (DJCM) 专属 S3 存储桶
  - 'djcs-multi-region-assets-ohio.s3.us-east-2.amazonaws.com' # 道琼斯全球客户支持多区域静态资产

  # 3. 公共图书馆学术读者卡免登录鉴权中转 (Boston Public Library)
  - '+.bpl.org'                                 # 波士顿公共图书馆官网与读者入口 (EZProxy 联动 WSJ Partner 免登录认证)

