  # --- 1.2 局域网协议标准与保留顶级域名 (RFC 6761 / RFC 8375) ---
  # 操作系统或内网设备约定的专用域名，不得向公网 DNS 查询或走代理
  - '+.local'                                   # mDNS 多播 DNS (Apple Bonjour / 局域网打印机 / 智能家居)
  - '+.lan'                                     # OpenWrt / 爱快等软路由常见的默认内网域名后缀
  - '+.localdomain'                             # Linux / Unix 系统常见的本地默认域名后缀
  - '+.internal'                                # RFC 6761 局域网私有服务内部域名
  - '+.home.arpa'                               # RFC 8375 智能家居及家庭网络保留专用域名 (Matter / Home Assistant)
  - '+.localhost'                               # RFC 6761 本地环回保留顶级域 (指向 127.0.0.1)
  - '+.example'                                 # RFC 2606 本地文档与示例保留顶级域
  - '+.invalid'                                 # RFC 2606 本地无效标识保留顶级域
  - '+.test'                                    # RFC 2606 本地测试环境专用保留顶级域

