  - '+.ai.google.dev'                           # Google AI 开发者中心与 Gemini SDK 文档
  - '+.generativeai.google'                     # Google Generative AI 官方主站与技术中心

  # 2. Gemini 核心模型推理、API 网关与后端中枢
  - '+.generativelanguage.googleapis.com'       # Google Gemini 官方大模型 API 核心网关接口
  - '+.proactivebackend-pa.googleapis.com'      # Gemini 主动式推荐与智能后端调度
  - '+.aisandbox-pa.googleapis.com'             # Google AI 沙盒与实验功能测试接口
  - '+.robinfrontend-pa.googleapis.com'         # Gemini / 搜索智能交互前端专有通道

  # 3. 客户端长连接、实时会话信号与交互服务
