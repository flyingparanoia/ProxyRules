  - '+.alkalimakersuite-pa.clients6.google.com' # Alkali MakerSuite 客户端交互接口
  - '+.signaler-pa.clients6.google.com'         # Gemini 实时多模态通信与会话信号调度
  - '+.waa-pa.clients6.google.com'              # Web & App 统一智能助手框架通道

