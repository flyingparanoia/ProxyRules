# ==============================================================================
# 规则名称: 大陆主流视频网站与 App PCDN 偷跑阻断规则集 (China-Video-Apps-PCDN)
# 更新时间: 2026-09-25
# 规则说明: 专门收集国内主流视频/直播 App（抖音、B站、爱优腾等）偷跑手机与宽带上行的 P2P 调度域名
# 适用策略: 在 Stash 中配置为 REJECT (拦截后 App 会自动降级走官方直连 CDN，视频秒开且不再发热偷跑)
# 适用平台: Stash, Clash rule-providers
# ==============================================================================
payload:
  # ============================================================================
  # 【第一部分：本次 iPhone 实机抓包确诊的移动端 P2P 边缘网络】
  # ============================================================================
  - '+.qrstuvwxyzab.com'                        # 北京空山信息 P2P CDN 调度（抖音、B站等短视频平台广泛共用）
  - '+.ydycdn.com'                              # 移动端短视频 P2P 边缘切片节点
  - '+.yingt.fun'                               # 上海莹田科技 P2P 传输节点（实测高频触发）
  - '+.jspcdn.cn'                               # 移动端短视频 P2P 缓存节点

  # ============================================================================
  # 【第二部分：国内其他主流视频平台高频 PCDN 节点 (连带阻断)】
  # ============================================================================
  - '+.mcdn.bilivideo.cn'                       # Bilibili 移动端/网页端自建 PCDN 节点
  - '+.szbdyd.com'                              # 移动端音视频通用 PCDN 调度网络
  - '+.onethingpcs.com'                         # 网心云/迅雷 PCDN 边缘网络
  - '+.xycdn.com'                               # 星域云 PCDN 边缘节点
  - '+.ndcpp.com'                               # 字节跳动/火山引擎移动端 P2P 调度中枢 (ndcpp)
  - '+.ndcpp.cn'                                # 字节跳动/火山引擎移动端 P2P 备用域名

